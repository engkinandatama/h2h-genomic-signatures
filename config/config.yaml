# config/config.yaml
# Konfigurasi Utama Pipeline Convergent Genomic Signatures

project_name: "Zoonotic_Convergent_Signatures"
outdir: "results"

# Threshold maksimal jumlah sekuens per grup
max_sequences_per_group: 100

# Optional third sequence source, keyed by taxon_id. GISAID has no open bulk API,
# so these files are downloaded by hand from the EpiNiV/EpiPox/etc. search page
# (tick "compl CDS" and "high cov.") and their paths recorded here. Records are
# deduplicated against GenBank and BV-BRC by exact nucleotide match, so anything
# already in the public archives contributes nothing.
#
# NOTE ON REDISTRIBUTION: the GISAID Database Access Agreement forbids
# redistributing sequences. Alignments containing GISAID records must NOT be
# deposited; publish the EPI_ISL accession list and the originating/submitting
# laboratory acknowledgements instead.
gisaid_sources:
  "3052225":   # Henipavirus nipahense
    fasta: ".dev/gisaid_epiniv/gisaid_niv_2026_07_25_11.fasta"
    metadata: ".dev/gisaid_epiniv/gisaid_niv_merged_metadata.tsv"

# Minimum CDS length in bp. Absolute floor only; it is the first of two length
# gates, the second being min_cds_length_fraction below.
min_length_cds: 200

# Relative length gate, applied per protein after the absolute floor: a CDS is
# kept only if it is at least this fraction of the 90th-percentile candidate
# length for that protein. The absolute floor alone cannot separate a 265 bp
# surveillance fragment from a 2031 bp full-length CDS, which is how partial
# sequences reached the alignments and drove median per-site occupancy in the
# Puumala L alignment down to about 4%. Set to 0 to disable.
min_cds_length_fraction: 0.70

# Upper bound of the same gate. A floor alone cannot reject a longer paralog,
# which clears it from above: three 6636 bp L-protein records passed into the
# Sudan GP dataset whose reference length is 2031 bp.
max_cds_length_fraction: 1.30

# Minimum fraction of a candidate's 5-mers that must occur in the UniProt
# reference protein. Length cannot separate neighbouring paralogs: a Marburg
# nucleoprotein is 695 aa against a 681 aa glycoprotein and reached the GP
# dataset at 102% of the reference length. Across all 1033 sequences here the
# on-target and off-target populations do not overlap -- the lowest genuine
# score is 0.459 and every off-target one is 0.00 -- so this cut sits between
# them with a wide margin. Set to 0 to disable.
min_reference_identity: 0.30

viruses:
  # ==========================================
  # 1. Hantavirus Family
  # ==========================================
  Andes_virus_H2H:
    family: "Hantaviridae"
    category: "H2H"
    taxon_id: "1980456"  # Andes orthohantavirus (updated from old ID 11608)
    host_filter: "Homo sapiens"
    uniprot_id: "Q9E006"
    proteins: ["GnGc", "L_protein"]
  Andes_virus_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "1980456"  # Andes orthohantavirus (updated from old ID 11608)
    host_filter: "Oligoryzomys|Necromys|Akodon" # Expanded rodent reservoir
    uniprot_id: "Q9E006"
    proteins: ["GnGc", "L_protein"]
    
  Sin_Nombre_virus_Spillover:
    family: "Hantaviridae"
    category: "Spillover"
    taxon_id: "3052499"  # Orthohantavirus sinnombreense (updated from old ID 11604)
    host_filter: "Homo sapiens"
    uniprot_id: "Q89905"   # SNV GnGc; per-protein IDs live in virus_groups
    proteins: ["GnGc", "L_protein"]
  Sin_Nombre_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "3052499"  # Orthohantavirus sinnombreense (updated from old ID 11604)
    host_filter: "Peromyscus" # Rodent reservoir
    uniprot_id: "Q89905"   # SNV GnGc; per-protein IDs live in virus_groups
    proteins: ["GnGc", "L_protein"]

  Puumala_virus_Spillover:
    family: "Hantaviridae"
    category: "Spillover"
    taxon_id: "3052493"  # Puumala orthohantavirus (updated from old ID 11606)
    host_filter: "Homo sapiens"
    uniprot_id: "P27312"   # PUUV GnGc; per-protein IDs live in virus_groups
    proteins: ["GnGc", "L_protein"]
  Puumala_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "3052493"  # Puumala orthohantavirus (updated from old ID 11606)
    host_filter: "Myodes|Clethrionomys" # Expanded rodent reservoir
    uniprot_id: "P27312"   # PUUV GnGc; per-protein IDs live in virus_groups
    proteins: ["GnGc", "L_protein"]

  # ==========================================
  # 2. Paramyxovirus Family
  # ==========================================
  # Bangladesh and India carry the same NiV-B clade and the same transmission
  # phenotype: both have documented person-to-person chains, and both draw on the
  # same Pteropus medius reservoir. India contributes only 6-8 unique sequences,
  # too few to support its own branch contrast, so the two are analysed as one
  # NiV-B human clade. Whether the site list depends on the Indian isolates is
  # answered by a sensitivity run that excludes them, not by splitting the group.
  Nipah_NiVB_H2H:
    family: "Paramyxoviridae"
    category: "H2H"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    geo_filter: "Bangladesh|India"
    host_filter: "Homo sapiens"
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
  # The 1998-99 Malaysian outbreak ran bat -> pig -> human, so swine and human
  # isolates are the same epidemiological event and the same viral lineage.
  # Human isolates alone number only 2-4 per protein, which is unanalysable;
  # including the amplifying host raises the outbreak clade to 6-11 and describes
  # the transmission chain more honestly than a human-only subset would.
  Nipah_Malaysia_Spillover:
    family: "Paramyxoviridae"
    category: "Spillover"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    geo_filter: "Malaysia"
    host_filter: "Homo sapiens|Sus scrofa"
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
  Nipah_Reservoir:
    family: "Paramyxoviridae"
    category: "Reservoir"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    host_filter: "Pteropus|Chiroptera" # Expanded bat reservoir
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
    
  # ==========================================
  # 3. Filovirus Family
  # ==========================================
  Ebola_Zaire_H2H:
    family: "Filoviridae"
    category: "H2H"
    taxon_id: "186538"
    host_filter: "Homo sapiens"
    uniprot_id: "Q05320"
    proteins: ["GP", "L_protein"]
  # Sudan ebolavirus is a second, independently emerged H2H-capable filovirus, added
  # as a replication of the Ebola Zaire positive control rather than as a new contrast:
  # 137 human records of which 149 are complete genomes, and no non-human host data,
  # so like EBOV it is analysed with site-level models only. Two independent H2H
  # filovirus lineages test whether an apparent H2H signature reproduces at all.
  Sudan_ebolavirus_H2H:
    family: "Filoviridae"
    category: "H2H"
    taxon_id: "186540"           # Sudan ebolavirus
    host_filter: "Homo sapiens"
    uniprot_id: "Q7T9D9"
    proteins: ["GP", "L_protein"]

  # Marburg supplies the reservoir contrast that Ebola structurally cannot: Rousettus
  # aegyptiacus is the confirmed natural reservoir, with 20 complete genomes spanning
  # 2007-2018 across Uganda, South Africa and Sierra Leone, against 75 complete human
  # genomes spanning 1987-2024 across five countries. Both clades clear the >=10
  # sequence threshold. MARV is spillover-dominant (documented human-to-human chains
  # are limited and nosocomial), so it plays the same comparator role for EBOV that
  # Sin Nombre and Puumala play for Andes.
  # min_length_cds must exclude the ~100 short surveillance fragments in the bat set.
  Marburg_Reservoir:
    family: "Filoviridae"
    category: "Reservoir"
    taxon_id: "3052505"          # Marburg marburgvirus (BV-BRC current taxon)
    host_filter: "Rousettus"     # confirmed natural reservoir
    uniprot_id: "P35253"
    proteins: ["GP", "L_protein"]
  Marburg_Spillover:
    family: "Filoviridae"
    category: "Spillover"
    taxon_id: "3052505"
    host_filter: "Homo sapiens"
    uniprot_id: "P35253"
    proteins: ["GP", "L_protein"]

  # Ebola_Zaire_Reservoir was removed deliberately. No usable reservoir group exists
  # in public sequence data: NCBI holds only 7 Chiroptera records for taxon 186538
  # (short surveillance fragments), while the 157 non-human primate records are all
  # from experimental challenge studies (isolate names carry inoculum doses such as
  # 10ffu/100ffu/1000ffu), which measure within-host variation from a single
  # inoculum rather than reservoir evolution. Gorilla and chimpanzee are dead-end
  # hosts, as humans are. EBOV is therefore analysed as a positive control for
  # H2H-capable evolution using site-level models only, with no branch-contrast
  # test, which is the role stated in the manuscript introduction.

virus_groups:
  Andes_virus:
    viruses: ["Andes_virus_H2H", "Andes_virus_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "Q9E006"  # fallback (GnGc)
    uniprot_ids:           # per-protein AlphaFold mapping
      GnGc: "Q9E006"      # Andes virus envelopment polyprotein (Gn+Gc)
      L_protein: "Q9E005"  # Andes virus RNA-directed RNA polymerase L
  Sin_Nombre_virus:
    viruses: ["Sin_Nombre_virus_Spillover", "Sin_Nombre_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "Q89905"  # fallback (GnGc)
    uniprot_ids:
      GnGc: "Q89905"      # Sin Nombre virus envelopment polyprotein (Gn+Gc)
      # Q89709 rather than the TrEMBL entry A0A0P0ALW1: same protein, same 2153 aa,
      # but reviewed and, unlike A0A0P0ALW1, present in AlphaFold DB, so the
      # structural mapping for this dataset is possible at all.
      L_protein: "Q89709"      # Sin Nombre virus RNA-directed RNA polymerase L
  Puumala_virus:
    viruses: ["Puumala_virus_Spillover", "Puumala_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "P27312"  # fallback (GnGc)
    uniprot_ids:
      GnGc: "P27312"      # Puumala virus envelopment polyprotein (Gn+Gc)
      L_protein: "P0C760"  # Puumala virus RNA-directed RNA polymerase L
  Nipah_NiVB:
    viruses: ["Nipah_NiVB_H2H", "Nipah_Reservoir"]
    proteins: ["G_protein", "F_protein", "L_protein"]
    family: "Paramyxoviridae"
    uniprot_id: "Q9IH62"  # fallback (G protein)
    uniprot_ids:
      G_protein: "Q9IH62"  # Nipah virus attachment glycoprotein G
      F_protein: "Q9IH63"  # Nipah virus fusion glycoprotein F
      L_protein: "Q997F0"  # Nipah virus RNA-directed RNA polymerase L
  Nipah_Malaysia:
    viruses: ["Nipah_Malaysia_Spillover", "Nipah_Reservoir"]
    proteins: ["G_protein", "F_protein", "L_protein"]
    family: "Paramyxoviridae"
    uniprot_id: "Q9IH62"  # fallback (G protein)
    uniprot_ids:
      G_protein: "Q9IH62"  # Nipah virus attachment glycoprotein G
      F_protein: "Q9IH63"  # Nipah virus fusion glycoprotein F
      L_protein: "Q997F0"  # Nipah virus RNA-directed RNA polymerase L
  Ebola_Zaire:
    viruses: ["Ebola_Zaire_H2H"]   # positive control; no reservoir group available
    proteins: ["GP", "L_protein"]
    family: "Filoviridae"
    uniprot_id: "Q05320"  # fallback (GP)
    uniprot_ids:
      GP: "Q05320"         # Envelope glycoprotein (Mayinga-76 strain)
      L_protein: "Q05318" # RNA-directed RNA polymerase L (Mayinga-76 strain)
  Sudan_ebolavirus:
    viruses: ["Sudan_ebolavirus_H2H"]   # second positive control; no reservoir data
    proteins: ["GP", "L_protein"]
    family: "Filoviridae"
    uniprot_id: "Q7T9D9"           # fallback (GP)
    uniprot_ids:
      GP: "Q7T9D9"                 # Envelope glycoprotein (Gulu strain, 676 aa)
      L_protein: "Q5XX01"          # RNA-directed RNA polymerase L (Gulu, 2210 aa)
  Marburg_virus:
    viruses: ["Marburg_Spillover", "Marburg_Reservoir"]
    proteins: ["GP", "L_protein"]
    family: "Filoviridae"
    uniprot_id: "P35253"           # fallback (GP)
    uniprot_ids:
      GP: "P35253"                 # Envelope glycoprotein (Musoke strain, 681 aa)
      L_protein: "P31352"          # RNA-directed RNA polymerase L (Musoke, 2331 aa)

params:
  mafft: "--auto --maxiterate 1000"
  # Bootstrap support below this value has its LABEL removed from the Newick
  # string. This does NOT collapse the branch: topology and branch lengths are
  # unchanged, and HyPhy does not read support values at all, so the setting has
  # no effect on any selection result. It is retained only so the labelled tree
  # matches the unlabelled one structurally. Do not describe it as a filter.
  bootstrap_threshold: 70
  iqtree: "-m TEST -B 1000"
  hyphy:
    pvalue_threshold: 0.05       # Threshold p-value untuk MEME dan FEL
    fubar_pp_threshold: 0.90     # Posterior probability threshold untuk FUBAR (rekomendasi > 0.90)
    # Number of site-level methods (MEME, FEL with direction, FUBAR, SLAC) that
    # must agree before a site is called consensus. This now governs both
    # consensus_pos and consensus_neg. It was 1, which meant a single MEME hit
    # produced a "consensus" site while the manuscript stated 2.
    min_methods: 2
    contrast_fel_fdr: 0.20       # FDR threshold untuk Contrast-FEL (lebih liberal karena test dua arah)

  # GARD recombination screening. It is by far the most expensive step: the
  # multi-breakpoint phase is a genetic algorithm whose cost grows sharply with
  # alignment length and sequence count, and single datasets have taken 6+ hours.
  # rate_classes is the main cost lever (HyPhy default 4); lowering it shrinks the
  # model space GARD searches.
  #
  # skip_datasets lists "<virus_group>/<protein>" entries to leave unscreened when
  # compute is the binding constraint. Skipped datasets are recorded with status
  # SKIPPED, never as "no recombination detected", so a dataset that was never
  # screened cannot be reported as clean. State the count in the Methods.
  gard:
    rate_classes: 4
    skip_datasets:
      - "Puumala_virus/L_protein"

  # Cross-family convergence analysis (rule analyze_convergence)
  convergence_permutations: 20000   # null model draws for bin co-occurrence
  breakpoint_margin_codons: 10      # a site this close to a GARD breakpoint is flagged

  # GISAID ORF extraction (rule fetch_gisaid). An ORF is accepted as the target
  # gene when its k-mer similarity to the UniProt reference clears min_identity
  # and its length sits inside the fraction bounds.
  gisaid:
    min_identity: 0.35
    min_length_fraction: 0.80
    max_length_fraction: 1.20
    max_ambiguous_fraction: 0.02

# Alokasi resource per task (Otomatis menyesuaikan dengan snakemake -c 64)
resources:
  threads:
    mafft: 4
    iqtree: 16
    hyphy: 8
  mem_mb:
    mafft: 4000
    iqtree: 16000
    hyphy: 8000

  # ─── RESOURCE TOKEN STRATEGY (penting untuk mencegah CPU meledak!) ──────
  #
  # Snakemake --cores hanya mengontrol jumlah JOB SLOT, bukan total thread.
  # Tool seperti IQ-TREE dan HyPhy spawn internal threads secara mandiri,
  # sehingga tanpa resource token tambahan, total CPU bisa jauh melampaui --cores.
  #
  # Solusi: gunakan 2 resource token eksplisit saat memanggil snakemake:
  #
  #   --resources ncbi_api=5 hyphy_jobs=6 iqtree_jobs=2
  #
  # Perhitungan aman untuk --cores 64:
  #   IQ-TREE  : 2 jobs × 16 threads = 32 threads
  #   HyPhy    : 6 jobs × 8 threads  = 48 threads
  #   Worst case (keduanya jalan bersamaan): 32 + 48 = 80 threads (bisa sesekali peak)
  #
  # Untuk budget ketat 64 threads murni, pakai:
  #   iqtree_jobs=2 dan hyphy_jobs=4  → 2×16 + 4×8 = 32+32 = 64 threads max
  #
  # Rekomendasi perintah final:
  #   snakemake --cores 64 --resources hyphy_jobs=4 iqtree_jobs=2 --use-conda --rerun-incomplete
  #
  # The hyphy_jobs / iqtree_jobs numbers above are the TOTAL token budget and can
  # only be supplied on the command line; Snakemake does not read resource
  # availability from the config file. Two keys used to sit here holding 4 and 2,
  # which read as settings but changed nothing. They were removed so the command
  # line stays the single place where concurrency is set.

# Domain boundaries used for the enrichment test. These are approximate and were
# chosen as round numbers rather than from a per-virus structural annotation, so
# the enrichment result is sensitive to where a boundary is placed. Any reported
# odds ratio should be checked against a shifted boundary before being claimed.
protein_domains:
  gngc:
    Gn_domain: [1, 400]
    Gc_domain: [401, 650]
    Tail_domain: [651, 1000]
  l_protein:
    N_terminal: [1, 599]
    RdRp_catalytic: [600, 1200]
    C_terminal: [1201, 2500]
  g_protein:
    Stalk_domain: [1, 299]
    RBD_domain: [300, 600]
  f_protein:
    Fusion_peptide: [100, 150]
    HR1_domain: [151, 250]
    HR2_domain: [450, 500]
  gp:
    RBD_domain: [50, 150]
    Mucin_like_domain: [300, 500]
