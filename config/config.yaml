# config/config.yaml
# Konfigurasi Utama Pipeline Convergent Genomic Signatures

project_name: "Zoonotic_Convergent_Signatures"
outdir: "results"

# Threshold maksimal jumlah sekuens per grup
max_sequences_per_group: 100

# Minimum panjang CDS (dalam base pairs) agar tidak memasukkan sekuens parsial (PCR fragments)
min_length_cds: 200

viruses:
  # ==========================================
  # 1. Hantavirus Family
  # ==========================================
  Andes_virus_H2H:
    family: "Hantaviridae"
    category: "H2H"
    taxon_id: "1980456"  # Andes orthohantavirus (updated from old ID 11608)
    host_filter: "Homo sapiens"
    uniprot_id: "Q8B8K7"
    proteins: ["GnGc", "L_protein"]
  Andes_virus_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "1980456"  # Andes orthohantavirus (updated from old ID 11608)
    host_filter: "Oligoryzomys|Necromys|Akodon" # Expanded rodent reservoir
    uniprot_id: "Q8B8K7"
    proteins: ["GnGc", "L_protein"]
    
  Sin_Nombre_virus_Spillover:
    family: "Hantaviridae"
    category: "Spillover"
    taxon_id: "3052499"  # Orthohantavirus sinnombreense (updated from old ID 11604)
    host_filter: "Homo sapiens"
    uniprot_id: "P33453"
    proteins: ["GnGc", "L_protein"]
  Sin_Nombre_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "3052499"  # Orthohantavirus sinnombreense (updated from old ID 11604)
    host_filter: "Peromyscus" # Rodent reservoir
    uniprot_id: "P33453"
    proteins: ["GnGc", "L_protein"]

  Puumala_virus_Spillover:
    family: "Hantaviridae"
    category: "Spillover"
    taxon_id: "3052493"  # Puumala orthohantavirus (updated from old ID 11606)
    host_filter: "Homo sapiens"
    uniprot_id: "P27313"
    proteins: ["GnGc", "L_protein"]
  Puumala_Reservoir:
    family: "Hantaviridae"
    category: "Reservoir"
    taxon_id: "3052493"  # Puumala orthohantavirus (updated from old ID 11606)
    host_filter: "Myodes|Clethrionomys" # Expanded rodent reservoir
    uniprot_id: "P27313"
    proteins: ["GnGc", "L_protein"]

  # ==========================================
  # 2. Paramyxovirus Family
  # ==========================================
  Nipah_Bangladesh_H2H:
    family: "Paramyxoviridae"
    category: "H2H"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    geo_filter: "Bangladesh"
    host_filter: "Homo sapiens"
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
  Nipah_Malaysia_Spillover:
    family: "Paramyxoviridae"
    category: "Spillover"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    geo_filter: "Malaysia"
    host_filter: "Homo sapiens"
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
  Nipah_Reservoir:
    family: "Paramyxoviridae"
    category: "Reservoir"
    taxon_id: "3052225"  # Henipavirus nipahense (updated from old ID 12058)
    host_filter: "Pteropus|Chiroptera" # Expanded bat reservoir
    uniprot_id: "Q9IH62"
    proteins: ["G_protein", "F_protein", "L_protein"]
    
  # ==========================================
  # 3. Filovirus Family
  # ==========================================
  Ebola_Zaire_H2H:
    family: "Filoviridae"
    category: "H2H"
    taxon_id: "186538"
    host_filter: "Homo sapiens"
    uniprot_id: "P87666"
    proteins: ["GP", "L_protein"]
  Ebola_Zaire_Reservoir:
    family: "Filoviridae"
    category: "Reservoir"
    taxon_id: "186538"
    host_filter: "Macaca|Gorilla|Pan troglodytes|bat|Bat" # Non-human hosts including primates
    uniprot_id: "P87666"
    proteins: ["GP", "L_protein"]

virus_groups:
  Andes_virus:
    viruses: ["Andes_virus_H2H", "Andes_virus_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "Q8B8K7"  # fallback (GnGc)
    uniprot_ids:           # per-protein AlphaFold mapping
      GnGc: "Q8B8K7"      # Andes virus envelope polyprotein (Gn+Gc)
      L_protein: "Q9E005"  # Andes virus RNA-directed RNA polymerase L
  Sin_Nombre_virus:
    viruses: ["Sin_Nombre_virus_Spillover", "Sin_Nombre_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "Q89905"  # fallback (GnGc)
    uniprot_ids:
      GnGc: "Q89905"      # Sin Nombre virus envelopment polyprotein (Gn+Gc)
      L_protein: "A0A0P0ALW1"  # Sin Nombre virus RNA-directed RNA polymerase L
  Puumala_virus:
    viruses: ["Puumala_virus_Spillover", "Puumala_Reservoir"]
    proteins: ["GnGc", "L_protein"]
    family: "Hantaviridae"
    uniprot_id: "P27312"  # fallback (GnGc)
    uniprot_ids:
      GnGc: "P27312"      # Puumala virus envelopment polyprotein (Gn+Gc)
      L_protein: "P0C760"  # Puumala virus RNA-directed RNA polymerase L
  Nipah_Bangladesh:
    viruses: ["Nipah_Bangladesh_H2H", "Nipah_Reservoir"]
    proteins: ["G_protein", "F_protein", "L_protein"]
    family: "Paramyxoviridae"
    uniprot_id: "Q9IH62"  # fallback (G protein)
    uniprot_ids:
      G_protein: "Q9IH62"  # Nipah virus attachment glycoprotein G
      F_protein: "Q9IH63"  # Nipah virus fusion glycoprotein F
      L_protein: "Q997F0"  # Nipah virus RNA-directed RNA polymerase L
  Nipah_Malaysia:
    viruses: ["Nipah_Malaysia_Spillover", "Nipah_Reservoir"]
    proteins: ["G_protein", "F_protein", "L_protein"]
    family: "Paramyxoviridae"
    uniprot_id: "Q9IH62"  # fallback (G protein)
    uniprot_ids:
      G_protein: "Q9IH62"  # Nipah virus attachment glycoprotein G
      F_protein: "Q9IH63"  # Nipah virus fusion glycoprotein F
      L_protein: "Q997F0"  # Nipah virus RNA-directed RNA polymerase L
  Ebola_Zaire:
    viruses: ["Ebola_Zaire_H2H", "Ebola_Zaire_Reservoir"]
    proteins: ["GP", "L_protein"]
    family: "Filoviridae"
    uniprot_id: "P87666"  # fallback (GP)
    uniprot_ids:
      GP: "P87666"         # Ebola Zaire envelope glycoprotein (Kikwit-95 strain)
      L_protein: "Q6V1Q2" # Ebola Zaire RNA-directed RNA polymerase L (Kikwit-95 strain)

params:
  mafft: "--auto --maxiterate 1000"
  bootstrap_threshold: 70     # Collapse internal branches with bootstrap < 70 before selection analyses
  iqtree: "-m TEST -B 1000"
  hyphy:
    pvalue_threshold: 0.05       # Threshold p-value untuk MEME dan FEL
    fubar_pp_threshold: 0.90     # Posterior probability threshold untuk FUBAR (rekomendasi > 0.90)
    min_methods: 1               # Diubah ke 1 agar menangkap situs seleksi episodik (MEME) yang sangat penting untuk adaptasi host
    contrast_fel_fdr: 0.20       # FDR threshold untuk Contrast-FEL (lebih liberal karena test dua arah)
    methods: ["MEME", "FEL", "FUBAR", "SLAC", "Contrast-FEL", "PRIME", "BUSTED", "aBSREL", "RELAX"]

# Alokasi resource per task (Otomatis menyesuaikan dengan snakemake -c 64)
resources:
  threads:
    mafft: 4
    iqtree: 16
    hyphy: 8
  mem_mb:
    mafft: 4000
    iqtree: 16000
    hyphy: 8000

